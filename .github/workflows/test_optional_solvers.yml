name: COPT CPU dispatch comparison
on:
  push:
    branches: [codex/copt-dispatch-check]
permissions:
  contents: read
jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        sample: [1, 2, 3]
        include:
          - os: ubuntu-22.04-arm
            sample: 1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: CPU features
        run: lscpu
      - name: Install CVXPY and COPT
        run: |
          uv venv
          uv pip install -e '.[testing,COPT]' coptpy==8.0.7
          .venv/bin/python -c "import cvxpy as cp; assert cp.COPT in cp.installed_solvers()"
      - name: Compare CPU settings on the same hardware
        run: |
          set +e
          ulimit -c 0
          for setting in default MKL_ENABLE_INSTRUCTIONS=AVX2 MKL_CBWR=AVX2 MKL_CBWR=COMPATIBLE; do
            args=()
            if [[ "$setting" != default ]]; then args+=("$setting"); fi
            for case in 'test_conic_solvers.py::TestCOPT::test_copt_exp_soc_1' 'test_qp_solvers.py::test_regression_1[COPT]'; do
              env "${args[@]}" .venv/bin/python -m pytest -q -rs "cvxpy/tests/$case"
              echo "$setting $case exit=$?" >> "$GITHUB_STEP_SUMMARY"
            done
          done
      - name: Exercise all COPT conic, quadratic and write tests with AVX2 cap
        env:
          MKL_ENABLE_INSTRUCTIONS: AVX2
        run: .venv/bin/python -m pytest -q -rs cvxpy/tests/test_conic_solvers.py cvxpy/tests/test_qp_solvers.py cvxpy/tests/test_copt_write.py -k copt
