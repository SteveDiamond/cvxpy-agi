name: COPT CPU dispatch comparison
on:
  push:
    branches: [codex/copt-dispatch-check]
permissions:
  contents: read
jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        sample: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: CPU features
        run: lscpu
      - name: Install the optional solver suite
        run: uv sync --all-extras --no-extra uno --dev
      - name: Compare full and isolated test processes
        run: |
          set +e
          ulimit -c 0
          run_case() {
            label=$1
            shift
            "$@" > "$RUNNER_TEMP/pytest.log" 2>&1
            status=$?
            echo "$label exit=$status"
            if [[ $status == 132 ]]; then
              grep -m 1 -F 'Illegal instruction' "$RUNNER_TEMP/pytest.log"
            else
              tail -n 2 "$RUNNER_TEMP/pytest.log"
            fi
          }
          conic=cvxpy/tests/test_conic_solvers.py
          qp=cvxpy/tests/test_qp_solvers.py
          for suite in "$conic" "$qp"; do
            run_case "full $suite" .venv/bin/pytest -q -m 'not knitro and not ortools' "$suite"
            run_case "AVX2 $suite" env MKL_ENABLE_INSTRUCTIONS=AVX2 .venv/bin/pytest -q -m 'not knitro and not ortools' "$suite"
            run_case "COPT only $suite" .venv/bin/pytest -q -k copt "$suite"
            run_case "without COPT $suite" .venv/bin/pytest -q -m 'not knitro and not ortools' -k 'not copt' "$suite"
          done
          for other in scs xpress mosek gurobi cvxopt scip highs moreau; do
            run_case "COPT and $other" .venv/bin/pytest -q -k "copt or $other" "$conic"
          done
