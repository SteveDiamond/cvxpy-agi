name: COPT CPU dispatch comparison
on:
  push:
    branches: [codex/copt-dispatch-check]
permissions:
  contents: read
jobs:
  solve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        sample: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: CPU features
        run: lscpu
      - name: Install two vendor solvers
        run: uv sync --extra copt --extra gurobi --extra testing
      - name: Compare sequential solves and environment changes
        shell: bash
        run: |
          ulimit -c 0
          cat > "$RUNNER_TEMP/solve.py" <<'PY'
          import os
          import subprocess
          import sys

          import cvxpy as cp
          from cvxpy.tests.solver_test_helpers import StandardTestMixedCPs

          def flags():
              return {key: val for line in subprocess.check_output(["env"], text=True).splitlines()
                      if "=" in line for key, val in [line.split("=", 1)]
                      if key.startswith(("MKL_", "KMP_", "OMP_", "INTEL_"))}

          def copt():
              StandardTestMixedCPs.test_exp_soc_1(solver="COPT", FeasTol=1e-9, DualTol=1e-9)

          print("Initial native environment", flags(), flush=True)
          for action in sys.argv[1:]:
              print("Running", action, flush=True)
              if action == "gurobi-import":
                  import gurobipy
              elif action == "gurobi-env":
                  import gurobipy
                  with gurobipy.Env() as e:
                      pass
              elif action == "gurobi-solve":
                  x = cp.Variable()
                  cp.Problem(cp.Minimize(x), [x >= 1]).solve(solver=cp.GUROBI)
              elif action == "copt-import":
                  import coptpy
              elif action == "copt":
                  copt()
              print("Native environment", flags(), flush=True)
          PY
          for config in default GRB_BLAS_WORKAROUND_SKIP=1 MKL_DEBUG_CPU_TYPE= MKL_DEBUG_CPU_TYPE=5; do
            args=()
            if [[ "$config" != default ]]; then args+=("$config"); fi
            result=0
            env "${args[@]}" .venv/bin/python "$RUNNER_TEMP/solve.py" gurobi-solve copt > "$RUNNER_TEMP/out" 2>&1 || result=$?
            echo "$config exit=$result"
            grep -e '^Running' -e '^Native environment' "$RUNNER_TEMP/out" || true
          done
      - name: Exercise both full suites with the Gurobi workaround disabled
        env:
          GRB_BLAS_WORKAROUND_SKIP: '1'
        run: |
          uv sync --all-extras --no-extra uno --dev
          uv run pytest -q -rs -m 'not knitro and not ortools' cvxpy/tests/test_conic_solvers.py
          uv run pytest -q -rs -m 'not knitro' cvxpy/tests/test_qp_solvers.py
